services:
  app:
    image: ghcr.io/mdriverpl/skopiujto:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Uzupełnij DATABASE_URL w .env}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=10)"
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3
