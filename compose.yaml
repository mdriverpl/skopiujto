services:
  app:
    image: ghcr.io/mdriverpl/skopiujto:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8000"
    env_file:
      - .env
    volumes:
      - mail-settings-data:/app/data
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      EDOCUMENTS_WEBPUSH_WORKER: "0"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=10)"
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3

  worker:
    image: ghcr.io/mdriverpl/skopiujto:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "backend.background_worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    volumes:
      - mail-settings-data:/app/data
    depends_on:
      app:
        condition: service_healthy

volumes:
  mail-settings-data:
