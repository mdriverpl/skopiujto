name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Pomiń testy frontendu i backendu'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Frontend tests
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_tests
        run: node --test src/*.test.mjs
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  backend:
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: edokumenty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d edokumenty_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ''
      EDOCUMENTS_STORAGE: database
      EDOCUMENTS_TEST_DATABASE_URL: postgresql://ci:ci-test-only@127.0.0.1:5432/edokumenty_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend -q

  docker:
    needs: [frontend, backend]
    if: >-
      ${{ !cancelled() && needs.frontend.result == 'success' &&
          (needs.backend.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && inputs.skip_tests && needs.backend.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: edokumenty_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d edokumenty_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: |
            ghcr.io/mdriverpl/skopiujto:latest
            ghcr.io/mdriverpl/skopiujto:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check container startup, frontend and API
        run: |
          docker run -d --name smoke --network host \
            -e DATABASE_URL=postgresql://ci:ci-test-only@127.0.0.1:5432/edokumenty_smoke \
            -e EDOCUMENTS_STORAGE=database \
            ghcr.io/mdriverpl/skopiujto:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              curl --fail --silent http://127.0.0.1:8000/ | grep -q '<html'
              curl --fail --silent http://127.0.0.1:8000/api/openapi.json > /dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs smoke || true
      - name: Remove test container
        if: always()
        run: docker rm -f smoke || true
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker push ghcr.io/mdriverpl/skopiujto:$COMMIT_SHA
          docker push ghcr.io/mdriverpl/skopiujto:latest
